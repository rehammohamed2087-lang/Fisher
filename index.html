<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صياد الأخطاء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:Cairo,Tahoma,sans-serif;color:#063a5a;background:linear-gradient(#ffe38a 0,#ffd0a0 9%,#7fe0f0 22%,#18a9d6 55%,#0b5fa5 100%) fixed;overflow-x:hidden}
.sun{position:fixed;top:10px;left:14px;font-size:44px}
.fl{position:fixed;font-size:26px;opacity:.55;animation:sw 16s linear infinite;pointer-events:none}
@keyframes sw{from{transform:translateX(110vw)}to{transform:translateX(-20vw)}}
.wave{position:fixed;bottom:0;left:0;width:200%;height:60px;opacity:.5;animation:wv 7s linear infinite;pointer-events:none}
@keyframes wv{to{transform:translateX(-50%)}}
main{position:relative;max-width:720px;margin:0 auto;padding:14px 14px 90px}
h1{font-weight:900;font-size:2.1rem;margin:6px 0;text-align:center;color:#b3261e;text-shadow:0 3px 0 #fff}
.card{background:rgba(255,255,255,.93);border-radius:26px;padding:18px;box-shadow:0 8px 0 #0b5fa5aa;border:4px solid #fff}
.hide{display:none}
label{font-weight:700;display:block;margin:8px 0 4px}
input{width:100%;font:inherit;font-size:1.2rem;padding:10px 14px;border-radius:16px;border:3px solid #18a9d6}
.g{display:flex;gap:10px;margin:10px 0}
.g button{flex:1}
button{font:inherit;font-weight:900;font-size:1.1rem;padding:10px 16px;border:0;border-radius:18px;background:#ffb703;color:#5a2d00;box-shadow:0 5px 0 #c97f00;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #c97f00}
button.on{background:#2ec4b6;color:#fff;box-shadow:0 5px 0 #1b8f84}
.big{width:100%;margin-top:12px;font-size:1.3rem;background:#ff6b6b;color:#fff;box-shadow:0 5px 0 #c23b3b}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:900;margin-bottom:8px}
.pill{background:#fff;border-radius:999px;padding:4px 14px;border:3px solid #18a9d6}
.bar{height:14px;background:#d6f3fb;border-radius:9px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9f1c,#ff4d6d);transition:width .4s}
.txt{font-size:1.3rem;line-height:2.5;background:linear-gradient(#e9fbff,#bdeefa);border-radius:20px;padding:12px 14px;border:3px dashed #18a9d6}
.w{display:inline-block;padding:0 6px;margin:2px;border-radius:12px;cursor:pointer;transition:.15s}
.w:hover{background:#fff6c2}
.w.ok{background:#b8f2c0;color:#0a6b25;font-weight:900;cursor:default}
.w.ok::after{content:" 🐟"}
.w.bad{animation:sh .4s;background:#ffc9c9}
@keyframes sh{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.note{min-height:2em;text-align:center;font-weight:900;color:#b3261e;margin:8px 0 0}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,0);font-size:2.6rem;font-weight:900;color:#fff;text-shadow:0 3px 0 #e63946,0 0 20px #ffb703;animation:up 1s forwards;pointer-events:none;z-index:9}
@keyframes up{to{transform:translate(-50%,-90px) scale(1.3);opacity:0}}
.cert{text-align:center;border:8px double #ffb703;background:#fffdf0;border-radius:18px;padding:18px 10px}
.cert h2{color:#b3261e;font-size:2rem;margin:4px}
.cert .nm{font-size:2rem;font-weight:900;color:#0b5fa5;border-bottom:3px dotted #ffb703;display:inline-block;padding:0 14px;margin:6px 0}
.cert .sc{font-size:2.4rem;font-weight:900;color:#e63946}
@media(prefers-reduced-motion:reduce){.fl,.wave{animation:none}}
</style>
</head>
<body>
<div class="sun">☀️</div>
<div class="fl" style="top:60%;animation-delay:-3s">🐠</div>
<div class="fl" style="top:78%;animation-delay:-9s;font-size:34px">🐋</div>
<div class="fl" style="top:88%;animation-delay:-6s">🦀</div>
<svg class="wave" viewBox="0 0 1200 60" preserveAspectRatio="none"><path d="M0 30Q75 0 150 30T300 30T450 30T600 30T750 30T900 30T1050 30T1200 30V60H0Z" fill="#fff"/></svg>
<main>
<h1>🎣 صياد الأخطاء ⚓</h1>

<section id="home" class="card">
<p style="font-weight:700;margin-top:0">أبحر في بحر اللغة العربية! اصطد الأخطاء العشرة في كل قطعة (همزة القطع، ألف الوصل، المثنى، جمع المذكر السالم، الأسماء الخمسة) لتنتقل إلى المستوى التالي.</p>
<label for="nm">اسمك الكريم</label>
<input id="nm" placeholder="اكتب اسمك هنا" autocomplete="off">
<div class="g"><button id="gm" class="on">👦 طالب</button><button id="gf">👧 طالبة</button></div>
<button class="big" id="go">⛵ ابدأ الرحلة</button>
</section>

<section id="game" class="hide">
<div class="top"><span class="pill" id="lv"></span><span class="pill" id="cnt"></span><button id="snd" style="padding:4px 12px">🔊</button></div>
<div class="bar"><i id="pb"></i></div>
<div class="card"><div class="txt" id="txt"></div><div class="note" id="note">اضغط على الكلمة التي تظن أن فيها خطأً 🎯</div>
<button class="big hide" id="nx">المستوى التالي 🌊</button></div>
</section>

<section id="end" class="hide card">
<div class="cert" id="cert"></div>
<p style="text-align:center;font-weight:700">التقط لقطة شاشة للشهادة لتحتفظ بها 📸</p>
<button class="big" id="again">🔄 رحلة جديدة</button>
</section>
</main>
<script>
const P=[
"{اشرقت|أشرقت} الشمس {فإستيقظ|فاستيقظ} {ابراهيم|إبراهيم} مبكرًا، وقال لأخيه: {أنطلق|انطلق} معي إلى الميناء. حمل {الإثنان|الاثنان} الشباك و{إستقلا|استقلا} القارب، و{اخذا|أخذا} يجدفان. كانت {الامواج|الأمواج} هادئة، و{إنتشر|انتشر} الصيادون يبحثون عن {الاسماك|الأسماك}، فابتسم إبراهيم فرحًا.",
"دخل {المعلمين|المعلمان} الفصل، وجلس {الطالبين|الطالبان} في مقعديهما. رأيت {الطالبان|الطالبين} يقرآن، وسلمت على {المعلمان|المعلمين}. إن {الكتابان|الكتابين} مفيدان، وكان {الصديقين|الصديقان} متعاونين. هذان القلمان {جديدين|جديدان}، وذهبت مع {الولدان|الولدين} إلى المكتبة ومررت {بالحديقتان|بالحديقتين}، وتحدث {المديرين|المديران} معًا.",
"حضر {المعلمين|المعلمون} حفل المدرسة، وكرّم المدير {المتفوقون|المتفوقين}. شكرت {المعلمون|المعلمين} على جهودهم، وإن {المجتهدون|المجتهدين} يفوزون دائمًا. كان {المسلمين|المسلمون} صادقين، وسلّمت على {المهندسون|المهندسين}. رأيت {الفلاحون|الفلاحين} في المزرعة، ومررت {بالمزارعون|بالمزارعين}. يحترم {الناجحين|الناجحون} وقت غيرهم، وفاز {اللاعبين|اللاعبون} بالكأس.",
"جاء {أباك|أبوك} إلى المدرسة، ورأيت {أخوك|أخاك} في الحديقة. سلمت على {أبوه|أبيه} وأكرمت {أخوه|أخاه}. إن {أبوك|أباك} كريم، ومررت {بأخوك|بأخيك}. جاء {أبا|أبو} بكر، وهذا رجل {ذي|ذو} علم، ورأيت طالبًا {ذو|ذا} خلق، ونظّف {فوك|فاك}.",
"{إنتهى|انتهى} اليوم الدراسي {فاخذ|فأخذ} {احمد|أحمد} حقيبته وقال: {إسمع|اسمع} يا {اخي|أخي}، {ان|أن} {الاستاذ|الأستاذ} طلب منا إحضار الكتب غدًا. {أستعد|استعد} للاختبار، {واجاب|وأجاب} أخوه: {إتفقنا|اتفقنا}!",
"{إستيقظت|استيقظت} {امي|أمي} باكرًا، {وإستعدت|واستعدت} للذهاب إلى السوق. {إشترت|اشترت} التفاح والبرتقال، {وإختارت|واختارت} {الاحسن|الأحسن} منها. ثم {اعطت|أعطت} البائع {الاجرة|الأجرة}، وعادت إلى المنزل {وإبتسمت|وابتسمت}، وفرحت {اختي|أختي} كثيرًا.",
"زار {الطالبين|الطالبان} المكتبة مع {ابيهما|أبيهما}، و{إستعار|استعار} {احدهما|أحدهما} كتابًا عن البحار. سلّم أمين المكتبة على {المعلمون|المعلمين}، وشكر {أبوهما|أباهما} على {إهتمامه|اهتمامه}. قرأ {الاخوان|الأخوان} كثيرًا، وخرج {الزائرين|الزائرون} مسرورين، و{إنتهت|انتهت} الزيارة بسلام.",
"رأى {الصيادين|الصيادون} حوتين كبيرين، {فإقتربوا|فاقتربوا} منهما بحذر. قال {ابو|أبو} سالم: {إحذروا|احذروا} الأمواج! هذان {الحوتين|الحوتان} ضخمان، فلا تقتربوا من {الحوتان|الحوتين}. إن {الصيادون|الصيادين} شجعان، {وإنطلقوا|وانطلقوا} عائدين، و{اخو|أخو} سالم يحمل {الاسماك|الأسماك}.",
"{إجتمع|اجتمع} الطلاب في الساحة، {واخبر|وأخبر} المشرف {المعلمون|المعلمين} بموعد الرحلة. حضر {أبا|أبو} خالد ومعه {إبنه|ابنه}، وركب {الأخوين|الأخوان} الحافلة، ورأيت {المعلمان|المعلمين} يبتسمان. انطلقت الحافلة {وإستمتع|واستمتع} {المسافرين|المسافرون} بالرحلة، وكانت {اجمل|أجمل} رحلة.",
"{احب|أحب} أبي البحر كثيرًا، {وإصطحبني|واصطحبني} مع {اخي|أخي} إلى الشاطئ. رأينا {الصيادون|الصيادين} يعودون، وسلّمنا على {أبو|أبي} علي. {إشترينا|اشترينا} سمكتين، وحملهما {الأخوين|الأخوان}. إن {المسلمون|المسلمين} يحمدون الله على نعمه. ورجعنا {وإبتسمت|وابتسمت} {امي|أمي}."
];
const $=id=>document.getElementById(id);
let name='',fem=false,lv=0,found=0,wrong=0,scores=[],snd=true,ac;
function tone(f,t,d,ty='sine',v=.2){if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+d);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+d)}catch(e){}}
function say(s){if(!snd)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='ar-SA';u.rate=1;speechSynthesis.speak(u)}catch(e){}}
const cheers=['أحسنت!','ممتاز!','رائع!','بطل!','صيد ثمين!','برافو!'];
function good(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.08,.25,'triangle'));const c=cheers[Math.floor(Math.random()*cheers.length)];say(c);pop('🎉 '+c)}
function fan(){[523,523,659,784,659,784,1047].forEach((f,i)=>tone(f,i*.14,.3,'square',.12));say(fem?'أحسنتِ! أكملتِ المستوى':'أحسنت! أكملت المستوى')}
function pop(t){const d=document.createElement('div');d.className='pop';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
$('gm').onclick=()=>{fem=false;$('gm').className='on';$('gf').className=''};
$('gf').onclick=()=>{fem=true;$('gf').className='on';$('gm').className=''};
$('snd').onclick=()=>{snd=!snd;$('snd').textContent=snd?'🔊':'🔇'};
$('go').onclick=()=>{name=$('nm').value.trim();if(!name){$('nm').focus();$('nm').style.borderColor='#e63946';return}
tone(440,0,.1);$('home').classList.add('hide');$('game').classList.remove('hide');lv=0;scores=[];load()};
function load(){found=0;wrong=0;$('nx').classList.add('hide');$('note').textContent='اضغط على الكلمة التي تظن أن فيها خطأً 🎯';
$('lv').textContent='🌊 المستوى '+(lv+1)+' من 10';$('pb').style.width=(lv*10)+'%';upd();
const box=$('txt');box.innerHTML='';
P[lv].split(' ').forEach(tk=>{const m=tk.match(/^([^{]*)\{([^|]+)\|([^}]+)\}(.*)$/);const s=document.createElement('span');s.className='w';
if(m){s.textContent=m[1]+m[2]+m[4];s.dataset.r=m[1]+m[3]+m[4];s.dataset.e=1}else s.textContent=tk;
s.onclick=()=>hit(s);box.appendChild(s);box.appendChild(document.createTextNode(' '))})}
function upd(){$('cnt').textContent='🐟 '+found+' / 10'}
function hit(s){if(s.classList.contains('ok')||found>=10)return;
if(s.dataset.e){s.textContent=s.dataset.r;s.classList.add('ok');found++;upd();$('note').textContent='';
if(found==10){const sc=Math.max(0,10-wrong);scores.push(sc);fan();$('note').textContent='🏆 اصطدت كل الأخطاء! درجتك في هذا المستوى: '+sc+' من 10';$('pb').style.width=((lv+1)*10)+'%';
$('nx').textContent=lv==9?'🏅 احصل على الشهادة':'المستوى التالي 🌊';$('nx').classList.remove('hide')}else good()}
else{wrong++;tone(180,0,.25,'sawtooth',.12);s.classList.add('bad');setTimeout(()=>s.classList.remove('bad'),400);$('note').textContent='هذه الكلمة صحيحة 🙂 حاول مرة أخرى (محاولات خاطئة: '+wrong+')'}}
$('nx').onclick=()=>{lv++;if(lv<10)load();else finish()};
function finish(){$('game').classList.add('hide');$('end').classList.remove('hide');const t=scores.reduce((a,b)=>a+b,0);
const r=t>=90?'ممتاز 🌟':t>=75?'جيد جدًا ⭐':t>=60?'جيد 👍':'مقبول — واصل التدريب 💪';
$('cert').innerHTML='<div style="font-size:2.6rem">🏅⚓🐠</div><h2>شهادة صياد الأخطاء الماهر</h2><p style="margin:4px">تُمنح هذه الشهادة إلى '+(fem?'الطالبة':'الطالب')+'</p><div class="nm"></div><p style="margin:6px">لإتمام'+(fem?'ها':'ه')+' المستويات العشرة بنجاح في اصطياد أخطاء الهمزات والمثنى وجمع المذكر السالم والأسماء الخمسة</p><div class="sc">'+t+' / 100</div><p style="font-weight:900;font-size:1.3rem;margin:4px">التقدير: '+r+'</p><p style="margin:4px">'+new Date().toLocaleDateString('ar-EG')+'</p>';
document.querySelector('.cert .nm').textContent=name;
[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.15,.4,'triangle',.18));say((fem?'مبروك يا ':'مبروك يا ')+name+'! حصلت على '+t+' من مئة')}
$('again').onclick=()=>{$('end').classList.add('hide');$('home').classList.remove('hide')};
</script>
</body>
</html>
